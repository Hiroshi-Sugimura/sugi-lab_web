<!DOCTYPE html>
<html lang="ja">

<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5W5H73XPRP"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-5W5H73XPRP');
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>ECHONET Lite Appendix Viewer - bitmap</title>
  <link rel="stylesheet" href="lib/bootstrap/css/bootstrap.min.css">
</head>

<body>
  <header>
    <div class="navbar navbar-dark bg-dark shadow-sm">
      <div class="container d-flex justify-content-between">
        <a href="#" class="navbar-brand">
          <h1 id="bitmap-title" class="h6"></h1>
        </a>
      </div>
    </div>
  </header>
  <main role="main">
    <div class="pt-3">
      <div class="container">
       <pre id="bitmap-content"></pre>
      </div>
    </div>
  </main>

  <!-- Bootstrap -->
  <script src="lib/jquery-3.3.1.min.js"></script>
  <script src="lib/popper.min.js"></script>
  <script src="lib/bootstrap/js/bootstrap.min.js"></script>

  <script>
    showContents();

    window.addEventListener('focus', () => {
      setTimeout(() => {
        showContents();
      }, 500);
    }, false);

    function showContents() {
      let title = window.localStorage.getItem('bitmap-title');
      let content = window.localStorage.getItem('bitmap-content');
      $('#bitmap-title').text(title);
      console.log(content);
      $('#bitmap-content').text(content);
    }

  </script>
</body>

</html>
